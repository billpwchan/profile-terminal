name: ci

on:
  push:
    branches: [main, master]
    paths-ignore: [README.md, README.zh-CN.md, "docs/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes terminal tests
      - run: python -m pytest -q
