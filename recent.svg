<svg xmlns="http://www.w3.org/2000/svg" width="880" height="152" viewBox="0 0 880 152" role="img" aria-label="Recently pushed repositories"><title>Recently pushed repositories</title>
<style>
@font-face{font-family:'Plex';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'Plex';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}

.m{font-family:'Plex',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.b{font-weight:600}
.live{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.breathe{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{stroke-opacity:.25}}
.flash{fill-opacity:0;animation:flash 2.6s .8s ease-out both}
@keyframes flash{0%{fill-opacity:0}12%{fill-opacity:.42}100%{fill-opacity:0}}
@media (prefers-reduced-motion:reduce){.live,.breathe,.flash{animation:none}}
@keyframes rs{0.00%,26.26%{transform:translate(10.0px,46.0px)}33.33%,59.60%{transform:translate(10.0px,76.0px)}66.67%,92.93%{transform:translate(10.0px,106.0px)}100%{transform:translate(10.0px,46.0px)}}
.rs{animation:rs 9.90s cubic-bezier(.65,0,.35,1) infinite}
@media (prefers-reduced-motion:reduce){.rs{display:none}}

</style>
<rect x="0.5" y=".5" width="879" height="151" rx="10" fill="#090b0e" stroke="#1d232c"/>
<rect x="18" y="19" width="6" height="11" rx="1" fill="#ffb224"/><text x="32" y="28.5" class="m b" font-size="11.5" letter-spacing=".6" fill="#ffb224">RECENT PUSHES</text><text x="862" y="28.5" class="m" font-size="11" fill="#7d8796" text-anchor="end">MOST RECENTLY UPDATED PUBLIC REPOSITORIES</text>
<g class="rs"><rect width="860.0" height="26.0" rx="5" fill="#ffb224" fill-opacity=".07" stroke="#ffb224" stroke-opacity=".55"/></g>
<g><text x="18" y="64" class="m b" font-size="12.5" fill="#ebe7df">dotfiles</text><text x="92.0" y="64" class="m" font-size="11.5" fill="#7d8796">Terminal, editor and tmux setup</text><text x="770" y="64" class="m" font-size="10" fill="#62c7ff" text-anchor="end">SHELL</text><text x="862" y="64" class="m" font-size="11" fill="#ffb224" text-anchor="end">3D AGO</text></g><line x1="18" y1="76.5" x2="862" y2="76.5" stroke="#161b22"/>
<g><text x="18" y="94" class="m b" font-size="12.5" fill="#ebe7df">kalman-playground</text><text x="159.5" y="94" class="m" font-size="11.5" fill="#7d8796">Kalman filters for pairs and spreads, explained</text><text x="770" y="94" class="m" font-size="10" fill="#62c7ff" text-anchor="end">PYTHON</text><text x="862" y="94" class="m" font-size="11" fill="#ffb224" text-anchor="end">23D AGO</text></g><line x1="18" y1="106.5" x2="862" y2="106.5" stroke="#161b22"/>
<g><text x="18" y="124" class="m b" font-size="12.5" fill="#ebe7df">latency-lab</text><text x="114.5" y="124" class="m" font-size="11.5" fill="#7d8796">Measuring tick-to-trade latency on commodity hardware</text><text x="770" y="124" class="m" font-size="10" fill="#62c7ff" text-anchor="end">C++</text><text x="862" y="124" class="m" font-size="11" fill="#ffb224" text-anchor="end">1MO AGO</text></g>
</svg>
